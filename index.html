<style>

.transport{display:grid;gap:10px} .transport-card{background:var(--ink);color:#fff;border-radius:20px;padding:17px 18px;display:flex;align-items:center;justify-content:space-between;gap:14px;box-shadow:var(--shadow)} .transport-card .r{font-weight:800} .transport-card .t{color:#bcd0da;font-size:13px;margin-top:4px} .transport-card .i{font-size:24px} .flinks{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px} .flinks a{background:rgba(255,255,255,.1);color:#f0d78f;border-radius:99px;padding:6px 10px;font-size:12px;font-weight:750;text-decoration:none}

.grid{display:grid;gap:12px} .info-card{background:#fff;border:1px solid #e3edf1;border-radius:20px;padding:17px;box-shadow:0 8px 26px rgba(20,33,43,.05)} .label{font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:#66899b;font-weight:850} .info-card h3{margin:5px 0 5px;font-size:17px} .info-card p,.foodline{color:#617078;font-size:13px;line-height:1.5;margin:0} .foodline+.foodline{margin-top:6px} .foodline a{text-decoration:none}
.exploreBtn{width:100%;border:1px solid var(--line);background:#fff;border-radius:18px;padding:14px;font-weight:800;color:#3e5f6f;cursor:pointer;margin-top:16px} .explore{display:none;margin-top:12px;grid-template-columns:1fr 1fr;gap:9px} .explore.open{display:grid} .place{background:#fff;border:1px solid #e3edf1;border-radius:16px;padding:13px;text-decoration:none;color:inherit} .place b{font-size:13px} .place small{display:block;color:#748087;margin-top:4px;line-height:1.35}
.prevnext{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:24px} .nav2{border:0;background:var(--ink);color:white;border-radius:17px;padding:13px;font-weight:800;cursor:pointer} .nav2.secondary{background:#eaf3f7;color:#365667} .nav2:disabled{opacity:.35}

.offline{display:none;margin:12px 20px 0;padding:9px 12px;border-radius:12px;background:#fff7e6;color:#7a5c14;font-size:12px;font-weight:700} .offline.show{display:block}
